<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hitansh Bhutani</title>
  <meta name="description" content="Hitansh Bhutani - screenwriter, director, editor and video essayist." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 20'%3E%3Crect width='28' height='20' rx='6' fill='%23ff0033'/%3E%3Cpath d='M11 5.5v9l7.5-4.5z' fill='white'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <script>
    // The site sits at the root on Vercel, but in a sub-folder on GitHub Pages,
    // where it is always opened at that folder's own address.
    (function () {
      var base = document.createElement("base");
      base.href = /\.github\.io$/.test(location.hostname) ? location.pathname.replace(/index\.html$/, "") : "/";
      document.head.appendChild(base);
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <div id="nav-progress" aria-hidden="true"></div>
  <header id="masthead">
    <div class="mh-start">
      <button class="icon-btn" id="guide-toggle" aria-label="Menu"></button>
      <a class="logo" href="./" data-link aria-label="Home">
        <span class="logo-mark"><svg viewBox="0 0 28 20" aria-hidden="true"><rect width="28" height="20" rx="6" fill="#ff0033"/><path d="M11 5.5v9l7.5-4.5z" fill="#fff"/></svg></span>
        <span class="logo-word">Districtansh</span><sup class="logo-cc">IN</sup>
      </a>
    </div>

    <div class="mh-center">
      <button class="icon-btn mh-back" id="search-back" aria-label="Back"></button>
      <form id="search-form" role="search" autocomplete="off">
        <div class="search-box">
          <span class="search-inner-icon"></span>
          <input id="search-input" type="text" name="search_query" placeholder="Search" aria-label="Search" spellcheck="false" />
          <button type="button" class="icon-btn search-clear" id="search-clear" aria-label="Clear search" hidden></button>
          <ul id="suggestions" role="listbox" hidden></ul>
        </div>
        <button type="submit" class="search-btn" aria-label="Search"></button>
      </form>
      <button class="icon-btn mic-btn" id="mic-btn" aria-label="Search with your voice"></button>
    </div>

    <div class="mh-end">
      <button class="icon-btn mh-search-open" id="search-open" aria-label="Search"></button>
      <div class="menu-anchor">
        <button class="create-btn" id="create-btn" aria-haspopup="true"><span class="create-icon"></span><span>Create</span></button>
      </div>
      <div class="menu-anchor">
        <button class="icon-btn" id="bell-btn" aria-label="Notifications" aria-haspopup="true"></button>
      </div>
      <div class="menu-anchor">
        <button class="avatar-btn" id="avatar-btn" aria-label="Account menu" aria-haspopup="true"></button>
      </div>
    </div>
  </header>

  <nav id="guide" aria-label="Main"></nav>
  <nav id="mini-guide" aria-label="Main"></nav>
  <div id="scrim" hidden></div>

  <main id="page"></main>

  <div id="popup" hidden></div>
  <dialog id="hire-dialog" aria-label="Hire">
    <button class="icon-btn dialog-close" id="hire-close" aria-label="Close"></button>
    <div class="hire-lines" id="hire-lines"></div>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/search.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
